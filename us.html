<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>H1 Font Example</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap');

    h1 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: clamp(2.2rem, 5vw, 4rem);
      line-height: 1.1;
      letter-spacing: -0.04em;
      color: #1f2937;
    }

    body {
      margin: 0;
      padding: 40px;
      background: #f4f7fb;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>
  <h1 style="color: #63B76C;">The Invasive Species Tracker</h1>
  <h3 style="color: #63B76C;">Created by the Poison Ivies</h3>
</body>
</html>
